# Default config used by `npm run dev`. Copy to ~/.config/radar/config.yaml
# and adjust — see README.md for the full schema.
dashboards:
  - name: Dashboard
    layout:
      direction: row
      children:
        - direction: column
          children:
            - panel: apple-calendar
            - panel: ricoberger-notes
              weight: 2
              params:
                dir: ~/Documents/GitHub/ricoberger/notes/daily
        - direction: column
          children:
            - panel: github-prs
              title: Created PRs
              params:
                query: 'author:@me is:open'
            - panel: github-prs
              title: PRs Review Requested
              params:
                query: 'review-requested:@me is:open'
            - panel: github-notifications
        - direction: column
          children:
            - panel: alerts
              params:
                filter: team-core
            - panel: apple-mail
  - name: Week
    layout:
      direction: row
      children:
        - panel: apple-calendar
          params:
            view: week
        - direction: column
          children:
            - panel: apple-calendar
              params:
                view: day
                day: yesterday
            - panel: apple-calendar
              params:
                view: day
                day: today
            - panel: apple-calendar
              params:
                view: day
                day: tomorrow
