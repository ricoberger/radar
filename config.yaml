# Default config used by `npm run dev`. Copy to ~/.config/radar/config.yaml
# and adjust — see README.md for the full schema.
dashboards:
  - name: Dashboard
    layout:
      direction: row
      children:
        - direction: column
          weight: 3
          children:
            - panel: alertmanager
              params:
                filter: team-core
        - direction: column
          weight: 2
          children:
            - panel: jira
              params:
                jql:
                  project = CORE AND assignee = currentUser() AND statusCategory
                  != Done AND status != Backlog ORDER BY priority DESC, updated
                  DESC
            - panel: github-notifications
              weight: 3
            - panel: github-prs
              weight: 2
              title: Created
              params:
                query: 'archived:false is:open author:@me'
            - panel: github-prs
              weight: 2
              title: Review Requested
              params:
                query: 'archived:false is:open review-requested:@me'
        - direction: column
          children:
            - panel: apple-calendar
              params:
                view: day
                day: today
            - panel: ricoberger-notes
              weight: 2
              params:
                dir: ~/Documents/GitHub/ricoberger/notes/daily
            - panel: apple-mail
