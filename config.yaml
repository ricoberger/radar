# Default config used by `npm run dev`. Copy to ~/.config/radar/config.yaml
# and adjust — see README.md for the full schema.
dashboards:
  - name: Dashboard
    layout:
      direction: row
      children:
        - direction: column
          weight: 3
          children:
            - panel: alertmanager
              title: Alerts (incident.io)
              params:
                filter: team-core (incident.io)
            - panel: alertmanager
              weight: 3
              params:
                filter: team-core
            - panel: kubectl-issues
              weight: 3
              params:
                command: pods
                contexts:
                  - prod-de1
                  - prod-us1
                  - prod-au1
                  - prod-ae1
                  - prod-core
                  - stage-de1
                  - dev-de1
                args:
                  - --all-namespaces
        - direction: column
          weight: 2
          children:
            - panel: jira
              params:
                jql:
                  project = CORE AND assignee = currentUser() AND statusCategory
                  != Done AND status != Backlog ORDER BY priority DESC, updated
                  DESC
            - panel: github-notifications
              weight: 3
            - panel: github-prs
              weight: 2
              title: Created
              params:
                query: 'archived:false is:open author:@me'
            - panel: github-prs
              weight: 2
              title: Review Requested
              params:
                query: 'archived:false is:open review-requested:@me'
        - direction: column
          children:
            - panel: apple-calendar
              params:
                view: day
                day: today
            - panel: ricoberger-notes
              weight: 2
              params:
                dir: ~/Documents/GitHub/ricoberger/notes/daily
            - panel: apple-mail
