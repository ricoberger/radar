---
name: Continuous Delivery

on:
  push:
    tags:
      - "v*"

permissions: read-all

jobs:
  npm:
    name: npm
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: |
          npm ci

      - name: Publish
        run: |
          npm publish

      - name: Pack
        run: |
          npm pack
          mv ricoberger-radar-*.tgz radar.tgz

      - name: Upload Artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} ./radar.tgz
