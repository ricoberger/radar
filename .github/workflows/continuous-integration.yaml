---
name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  go:
    name: Go
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: |
          go vet ./...

      - name: Build
        run: |
          go build ./...
